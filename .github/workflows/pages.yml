name: Publish site

on:
  workflow_dispatch:
    inputs:
      notify_search:
        description: Notify IndexNow that the homepage changed
        type: boolean
        default: false

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build -- --base="$PAGES_BASE/"
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Prepare search verification file
        if: github.repository == 'taosin/will-it-clip'
        run: node scripts/indexnow.mjs prepare
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        env:
          # The upload action uses verbose GNU tar; keep the verification filename out of logs.
          TAR_OPTIONS: --index-file=/dev/null
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    name: Notify IndexNow
    needs: deploy
    if: inputs.notify_search && github.repository == 'taosin/will-it-clip'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs notify
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
